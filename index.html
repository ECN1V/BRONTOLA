<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ILY &lt;3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      touch-action: pan-x pan-y;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #5b1028;
    }

    .sunflower-pattern {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background-color: #5b1028;
      background-image: radial-gradient(#773047 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .flower-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-content: center;
      padding: 2rem;
      text-align: center;
      pointer-events: none;
    }

    .content h1 {
      margin: 0;
      color: #fff3dc;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: -0.05em;
    }

    .content p {
      margin: 0.75rem 0 0;
      color: #e7c7c8;
      font-size: 1.05rem;
    }

    #sequence {
      width: min(100%, 700px);
      padding: clamp(1.5rem, 5vw, 3rem);
      color: #fff3dc;
      background: rgba(148, 54, 84, 0.88);
      border: 1px solid rgb(255 243 220 / 28%);
      border-radius: 21px;
      box-shadow:
        0 16px 50px rgb(35 5 16 / 35%),
        inset 0 1px 0 rgb(255 243 220 / 10%);
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 500ms ease;
    }

    #sequence.visible {
      opacity: 1;
    }

    .phrase {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 4.5vw, 1.7rem);
      line-height: 1.6;
      animation: arrive 500ms ease both;
    }

    .phrase img {
      width: 270px;
      height: 270px;
    }

    .phrase-text {
      white-space: pre-wrap;
    }

    .phrase-text::after {
      content: "";
      display: inline-block;
      height: 1em;
      border-right: 2px solid currentColor;
      margin-left: 3px;
      vertical-align: -0.15em;
      animation: blink 1s steps(1) infinite;
    }

    .phrase.leaving {
      animation: leave 500ms ease both;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes leave {
      to { opacity: 0; transform: translateY(-12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .phrase,
      .phrase.leaving,
      .phrase-text::after {
        animation-duration: 1ms;
      }
    }

    #hearts {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .content {
      z-index: 2;
    }

  </style>
</head>

<body>
  <main class="sunflower-pattern">
    <canvas class="flower-canvas" aria-hidden="true"></canvas>
    <canvas id="hearts" aria-hidden="true"></canvas>

    <div class="content">
      <div id="sequence" aria-live="polite"></div>
      <audio id="music" preload="auto">
        <source src="forever.m4a" type="audio/mpeg">
      </audio>
    </div>
  </main>

<script>
  const canvas = document.querySelector(".flower-canvas");
  const container = document.querySelector(".sunflower-pattern");
  const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  const petalCount = 12;
  const bloomDuration = 0.8;
  const vanishDuration = 0.7;
  const flowers = [];

  let width = 0;
  let height = 0;
  let spacing = 125;
  let animationFrame;

  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = rect.width;
    height = rect.height;

    spacing = Math.max(125, width / 12);

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    flowers.length = 0;

    const columns = Math.ceil(width / spacing) + 2;
    const rows = Math.ceil(height / spacing) + 2;

    for (let row = -1; row < rows; row++) {
      for (let column = -1; column < columns; column++) {
        flowers.push({
          x: column * spacing + spacing / 2,
          y: row * spacing + spacing / 2,
          swayDelay: Math.random() * 5,
          vanishDelay: 2.5 + Math.random() * 1.6,
          bloomBaseDelay: Math.random() * 0.45
        });
      }
    }
  }

  function drawPetal(angle, progress) {
    if (progress <= 0) return;

    let scale;
    let distance;

    if (progress < 0.7) {
      const t = progress / 0.7;
      const eased = 1 - Math.pow(1 - t, 3);
      scale = 0.05 + (1.08 - 0.05) * eased;
      distance = -4 + (-22 + 4) * eased;
    } else {
      const t = (progress - 0.7) / 0.3;
      scale = 1.08 + (1 - 1.08) * t;
      distance = -22 + (-20 + 22) * t;
    }

    ctx.save();
    ctx.rotate(angle);
    ctx.translate(0, distance);
    ctx.scale(scale, scale);
    ctx.fillStyle = "#f1bb49";
    ctx.beginPath();
    ctx.ellipse(0, 0, 6.5, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawFlower(flower, time) {
    const fadeProgress = reduceMotion.matches
      ? 0
      : Math.max(0, Math.min(1,
          (time - flower.vanishDelay) / vanishDuration
        ));
    const flowerOpacity = 1 - fadeProgress;

    if (flowerOpacity <= 0) return;

    const sway = reduceMotion.matches
      ? 0
      : Math.sin(((time - flower.swayDelay) / 5) * Math.PI * 2)
          * (2 * Math.PI / 180);

    ctx.save();
    ctx.translate(flower.x, flower.y);
    ctx.rotate(sway);
    ctx.globalAlpha = flowerOpacity;

    for (let i = 0; i < petalCount; i++) {
      const petalDelay = flower.bloomBaseDelay + i * 0.045;
      const progress = reduceMotion.matches
        ? 1
        : Math.max(0, Math.min(1, (time - petalDelay) / bloomDuration));

      drawPetal((i * 36 * Math.PI) / 180, progress);
    }

    ctx.fillStyle = "#70472e";
    ctx.beginPath();
    ctx.arc(0, 0, 9.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgb(255 255 255 / 25%)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  function render(timestamp) {
    const time = timestamp / 1000;

    ctx.clearRect(0, 0, width, height);

    ctx.save();
    ctx.translate(width / 2, height / 2);
    ctx.rotate(-8 * Math.PI / 180);
    ctx.translate(-width / 2, -height / 2);

    flowers.forEach(flower => drawFlower(flower, time));

    ctx.restore();

    if (!reduceMotion.matches && time < 5.4) {
      animationFrame = requestAnimationFrame(render);
    }
  }

  function restart() {
    cancelAnimationFrame(animationFrame);
    resizeCanvas();

    if (reduceMotion.matches) {
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(-8 * Math.PI / 180);
      ctx.translate(-width / 2, -height / 2);
      flowers.forEach(flower => drawFlower(flower, 0));
      ctx.restore();
    } else {
      animationFrame = requestAnimationFrame(render);
    }
  }

  const resizeObserver = new ResizeObserver(restart);
  resizeObserver.observe(container);

  window.addEventListener("orientationchange", restart);
  reduceMotion.addEventListener("change", restart);

  restart();

  setTimeout(() => {
    const music = document.getElementById("music");
    if (!music) return;

    music.volume = 0.50;
    music.play().catch(error => {
      console.log("The browser blocked automatic audio playback:", error);
    });
  }, 1000);

  // block the zoom

  window.addEventListener("wheel", event => {
  if (event.ctrlKey || event.metaKey) event.preventDefault();
  }, { passive: false });

  document.addEventListener("gesturestart", event => event.preventDefault());
  document.addEventListener("gesturechange", event => event.preventDefault());

  window.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) &&
      ["+", "-", "=", "0"].includes(event.key)) {
      event.preventDefault();
  }
  });
  
</script>

  const sequenceContainer = document.getElementById("sequence");
  let phraseIndex = 0;

  const typingAudio = new (window.AudioContext || window.webkitAudioContext)();

  function playTypingSound() {
    if (typingAudio.state === "suspended") {
      typingAudio.resume();
    }

    const oscillator = typingAudio.createOscillator();
    const gain = typingAudio.createGain();

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(750 + Math.random() * 250, typingAudio.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(350, typingAudio.currentTime + 0.025);

    gain.gain.setValueAtTime(0.35, typingAudio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, typingAudio.currentTime + 0.03);

    oscillator.connect(gain);
    gain.connect(typingAudio.destination);

    oscillator.start();
    oscillator.stop(typingAudio.currentTime + 0.03);
  }

  const heartsCanvas = document.getElementById("hearts");
  const heartsCtx = heartsCanvas.getContext("2d");
  const floatingHearts = [];
  let heartsStarted = false;

  function resizeHeartsCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = heartsCanvas.getBoundingClientRect();

    heartsCanvas.width = Math.round(rect.width * dpr);
    heartsCanvas.height = Math.round(rect.height * dpr);
    heartsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawnHeart() {
    const size = 10 + Math.random() * 24;
    const startY = window.innerHeight + size;

    floatingHearts.push({
      x: Math.random() * window.innerWidth,
      y: startY,
      size,
      speed: 0.6 + Math.random() * 1.8,
      sway: Math.random() * 0.8 - 0.4,
      rotation: Math.random() * 0.5 - 0.25,
      traveled: 0,
      distance: startY + size,
      opacity: 0
    });
  }

  function drawHeart(heart) {
    heartsCtx.save();
    heartsCtx.translate(heart.x, heart.y);
    heartsCtx.rotate(heart.rotation);
    heartsCtx.globalAlpha = heart.opacity;
    heartsCtx.fillStyle = "#fff";

    const s = heart.size;
    heartsCtx.beginPath();
    heartsCtx.moveTo(0, s * 0.45);
    heartsCtx.bezierCurveTo(-s * 0.15, s * 0.3, -s * 0.6, -s * 0.05, -s * 0.48, -s * 0.35);
    heartsCtx.bezierCurveTo(-s * 0.38, -s * 0.62, -s * 0.08, -s * 0.55, 0, -s * 0.34);
    heartsCtx.bezierCurveTo(s * 0.08, -s * 0.55, s * 0.38, -s * 0.62, s * 0.48, -s * 0.35);
    heartsCtx.bezierCurveTo(s * 0.6, -s * 0.05, s * 0.15, s * 0.3, 0, s * 0.45);
    heartsCtx.closePath();
    heartsCtx.fill();
    heartsCtx.restore();
  }

  function animateHearts() {
    heartsCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    if (Math.random() < 0.12) spawnHeart();

    for (let i = floatingHearts.length - 1; i >= 0; i--) {
      const heart = floatingHearts[i];
      heart.y -= heart.speed;
      heart.x += heart.sway;
      heart.traveled += heart.speed;

      const progress = Math.min(1, heart.traveled / heart.distance);
      heart.opacity = progress < 0.15
        ? progress / 0.15
        : progress > 0.75
          ? (1 - progress) / 0.25
          : 1;

      drawHeart(heart);
      if (progress >= 1) floatingHearts.splice(i, 1);
    }

    requestAnimationFrame(animateHearts);
  }

  function startHeartsAnimation() {
    if (heartsStarted) return;
    heartsStarted = true;
    resizeHeartsCanvas();
    animateHearts();
  }

  window.addEventListener("resize", resizeHeartsCanvas);
  resizeHeartsCanvas();

  function showPhrase() {
    if (phraseIndex >= sequence.length) return;

    const item = sequence[phraseIndex];
    const paragraph = document.createElement("p");
    paragraph.className = "phrase";

    if (item.svgBase64) {
      const image = document.createElement("img");
      image.src = `data:image/svg+xml;base64,${item.svgBase64}`;
      image.alt = "";
      paragraph.appendChild(image);
    }

    const textElement = document.createElement("span");
    textElement.className = "phrase-text";
    paragraph.appendChild(textElement);
    sequenceContainer.appendChild(paragraph);

    let characterIndex = 0;

    function typeNextCharacter() {
      if (characterIndex < item.text.length) {
        const character = item.text[characterIndex];
        textElement.textContent += character;
        if (character.trim()) playTypingSound();
        characterIndex++;

        const pause = /[.!?,]/.test(character) ? 200 : 45;
        setTimeout(typeNextCharacter, pause);
      } else {
        if (phraseIndex === sequence.length - 1) {
          startHeartsAnimation();
          return;
        }

        setTimeout(() => {
          paragraph.classList.add("leaving");

          paragraph.addEventListener("animationend", () => {
            paragraph.remove();
            phraseIndex++;
            showPhrase();
          }, { once: true });
        }, 700);
      }
    }

    typeNextCharacter();
  }

  const delay = reduceMotion.matches ? 0 : 5400;

  setTimeout(() => {
    sequenceContainer.classList.add("visible");
    showPhrase();
  }, delay);
</script>
